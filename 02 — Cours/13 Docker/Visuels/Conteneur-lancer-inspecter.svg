<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#10243b"/><stop offset="1" stop-color="#071321"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#8bdcff" stroke-width="1.5"/></marker></defs><rect width="1200" height="720" rx="28" fill="url(#bg)"/><g font-family="Arial"><text x="48" y="65" fill="#fff" font-size="38" font-weight="700">Lancer et inspecter un conteneur</text><text x="50" y="105" fill="#a9c9e7" font-size="20">Une image sert de point de départ ; le conteneur est l’instance qui tourne.</text><rect x="50" y="145" width="1100" height="110" rx="18" fill="#122e4b" stroke="#338bce" stroke-width="3"/><text x="80" y="185" fill="#72d8ff" font-size="20" font-weight="bold">1 — Lancer Nginx en arrière-plan</text><text x="80" y="225" fill="#8cff9a" font-size="27" font-family="monospace">docker run -d --name web -p 8080:80 nginx</text><g><rect x="55" y="300" width="300" height="235" rx="20" fill="#122e4b" stroke="#338bce" stroke-width="3"/><text x="205" y="345" fill="#fff" font-size="26" text-anchor="middle" font-weight="bold">Image nginx</text><rect x="115" y="370" width="180" height="90" rx="12" fill="#0876db"/><path d="M135 390h140v50H135z" fill="#20baff"/><text x="205" y="425" fill="#fff" font-size="22" text-anchor="middle" font-weight="bold">NGINX</text><text x="205" y="495" fill="#d8eafa" font-size="18" text-anchor="middle">Le modèle utilisé</text><rect x="450" y="300" width="300" height="235" rx="20" fill="#0b3c60" stroke="#20baff" stroke-width="4"/><text x="600" y="345" fill="#fff" font-size="26" text-anchor="middle" font-weight="bold">Conteneur web</text><rect x="515" y="370" width="170" height="90" rx="12" fill="#0876db"/><text x="600" y="425" fill="#fff" font-size="24" text-anchor="middle" font-weight="bold">▶ NGINX</text><text x="600" y="495" fill="#d8eafa" font-size="18" text-anchor="middle">Le processus tourne</text><path d="M355 415H440" stroke="#8bdcff" stroke-width="5" marker-end="url(#arr)"/><text x="397" y="390" fill="#a9c9e7" font-size="16" text-anchor="middle">crée</text><rect x="850" y="300" width="300" height="235" rx="20" fill="#123b36" stroke="#39d98a" stroke-width="3"/><text x="1000" y="345" fill="#8cffb6" font-size="26" text-anchor="middle" font-weight="bold">Navigateur</text><rect x="885" y="375" width="230" height="80" rx="10" fill="#e8f4ff"/><text x="1000" y="408" fill="#123b36" font-size="18" text-anchor="middle">http://localhost:8080</text><text x="1000" y="438" fill="#0876db" font-size="21" text-anchor="middle" font-weight="bold">NGINX</text><path d="M750 415H840" stroke="#8bdcff" stroke-width="5" marker-end="url(#arr)"/><text x="795" y="390" fill="#a9c9e7" font-size="16" text-anchor="middle">port 8080 → 80</text><rect x="55" y="575" width="1095" height="95" rx="18" fill="#142d48" stroke="#477da9" stroke-width="2"/><text x="80" y="612" fill="#72d8ff" font-size="20" font-weight="bold">2 — Vérifier ce qui se passe</text><text x="80" y="648" fill="#fff" font-size="20" font-family="monospace">docker ps</text><text x="300" y="648" fill="#d8eafa" font-size="18">conteneurs en cours</text><text x="565" y="648" fill="#fff" font-size="20" font-family="monospace">docker logs web</text><text x="760" y="648" fill="#d8eafa" font-size="18">messages du programme</text><text x="80" y="700" fill="#8cffb6" font-size="18">À retenir : docker stop web arrête le conteneur ; docker rm web le supprime (après l’arrêt).</text></g></svg>