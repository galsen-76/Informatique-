<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#10243b"/><stop offset="1" stop-color="#071321"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#8bdcff" stroke-width="1.5"/></marker></defs><rect width="1200" height="700" rx="28" fill="url(#bg)"/><text x="48" y="68" fill="#fff" font-size="38" font-weight="700" font-family="Arial">Construire une image : couches et cache</text><text x="50" y="105" fill="#a9c9e7" font-size="20" font-family="Arial">Chaque instruction ajoute une couche ; Docker réutilise celles qui n’ont pas changé.</text><g font-family="Arial"><rect x="55" y="160" width="420" height="390" rx="22" fill="#122e4b" stroke="#338bce" stroke-width="3"/><text x="85" y="205" fill="#fff" font-size="27" font-weight="bold">Dockerfile = la recette</text><rect x="85" y="235" width="360" height="65" rx="12" fill="#203c5a"/><text x="110" y="276" fill="#fff" font-size="22">FROM python:3.12</text><rect x="85" y="315" width="360" height="65" rx="12" fill="#203c5a"/><text x="110" y="356" fill="#fff" font-size="22">COPY requirements.txt .</text><rect x="85" y="395" width="360" height="65" rx="12" fill="#203c5a"/><text x="110" y="436" fill="#fff" font-size="22">RUN pip install -r ...</text><rect x="85" y="475" width="360" height="50" rx="12" fill="#203c5a"/><text x="110" y="508" fill="#fff" font-size="22">COPY . .</text><path d="M475 350H545" stroke="#8bdcff" stroke-width="5" marker-end="url(#a)"/><text x="590" y="180" fill="#fff" font-size="27" font-weight="bold">Image construite en couches</text><g><rect x="590" y="220" width="360" height="72" rx="14" fill="#174b75" stroke="#4aa9e8" stroke-width="2"/><text x="770" y="265" text-anchor="middle" fill="#fff" font-size="23">Base Python</text><rect x="590" y="305" width="360" height="72" rx="14" fill="#5a3c8e" stroke="#b68aff" stroke-width="2"/><text x="770" y="350" text-anchor="middle" fill="#fff" font-size="23">Dépendances installées</text><rect x="590" y="390" width="360" height="72" rx="14" fill="#0876a9" stroke="#55d7ff" stroke-width="2"/><text x="770" y="435" text-anchor="middle" fill="#fff" font-size="23">Code de l’application</text></g><path d="M950 350H1000" stroke="#8bdcff" stroke-width="5" marker-end="url(#a)"/><rect x="1000" y="245" width="150" height="210" rx="18" fill="#123b36" stroke="#39d98a" stroke-width="3"/><text x="1075" y="295" fill="#8cffb6" font-size="24" text-anchor="middle" font-weight="bold">Cache</text><text x="1075" y="345" fill="#fff" font-size="18" text-anchor="middle">Réutilise</text><text x="1075" y="375" fill="#fff" font-size="18" text-anchor="middle">les couches</text><text x="1075" y="405" fill="#fff" font-size="18" text-anchor="middle">inchangées</text><rect x="55" y="585" width="1095" height="75" rx="18" fill="#073a32" stroke="#39d98a" stroke-width="3"/><text x="85" y="632" fill="#fff" font-size="22" font-family="Arial">Astuce : copie et installe les dépendances avant de copier ton code, pour conserver leur cache si seul le code change.</text></g></svg>