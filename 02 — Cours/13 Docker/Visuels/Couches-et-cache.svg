<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#10243b"/><stop offset="1" stop-color="#071321"/></linearGradient><linearGradient id="c1" x2="1" y2="1"><stop stop-color="#1688e8"/><stop offset="1" stop-color="#07529d"/></linearGradient><linearGradient id="c2" x2="1" y2="1"><stop stop-color="#a56bff"/><stop offset="1" stop-color="#6032b2"/></linearGradient><linearGradient id="c3" x2="1" y2="1"><stop stop-color="#24c5ff"/><stop offset="1" stop-color="#0876c8"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#9bdfff" stroke-width="1.5"/></marker></defs><rect width="1200" height="700" rx="28" fill="url(#bg)"/><g font-family="Arial"><text x="48" y="66" fill="#fff" font-size="39" font-weight="700">Une image Docker est faite de couches</text><text x="50" y="106" fill="#a9c9e7" font-size="21">Chaque couche ajoute une partie ; ensemble, elles forment un modèle complet.</text><text x="90" y="175" fill="#72d8ff" font-size="24" font-weight="bold">Les éléments s’empilent</text><g stroke="#bfeaff" stroke-width="2"><path d="M105 465l170-80 245 80-170 88z" fill="url(#c1)"/><path d="M105 365l170-80 245 80-170 88z" fill="url(#c2)"/><path d="M105 265l170-80 245 80-170 88z" fill="url(#c3)"/></g><g fill="#fff" font-size="23" font-weight="bold"><text x="275" y="282" text-anchor="middle">Application</text><text x="275" y="382" text-anchor="middle">Dépendances</text><text x="275" y="482" text-anchor="middle">Base système</text></g><path d="M545 365H665" stroke="#9bdfff" stroke-width="5" marker-end="url(#arr)"/><rect x="685" y="225" width="225" height="285" rx="24" fill="#123b60" stroke="#20baff" stroke-width="4"/><g transform="translate(735 285)"><path d="M0 65l65-35 110 35-65 38z" fill="#20baff"/><path d="M0 25l65-35 110 35-65 38z" fill="#1688e8"/><path d="M0 -15l65-35 110 35-65 38z" fill="#64d8ff"/></g><text x="797" y="445" fill="#fff" font-size="28" text-anchor="middle" font-weight="bold">Image Docker</text><text x="797" y="477" fill="#bfeaff" font-size="18" text-anchor="middle">Un modèle assemblé</text><path d="M910 365H1000" stroke="#9bdfff" stroke-width="5" marker-end="url(#arr)"/><rect x="1000" y="270" width="150" height="190" rx="20" fill="#123b36" stroke="#39d98a" stroke-width="3"/><text x="1075" y="320" fill="#8cffb6" font-size="24" text-anchor="middle" font-weight="bold">Cache</text><circle cx="1075" cy="370" r="26" fill="#39d98a"/><path d="M1062 370l9 9 18-21" stroke="#073a32" stroke-width="6" fill="none"/><text x="1075" y="420" fill="#fff" font-size="17" text-anchor="middle">Garde les couches</text><text x="1075" y="443" fill="#fff" font-size="17" text-anchor="middle">inchangées</text><rect x="55" y="585" width="1090" height="75" rx="18" fill="#102d49" stroke="#3e8cc4" stroke-width="2"/><text x="85" y="630" fill="#fff" font-size="22">Si une partie change, Docker reconstruit cette couche et celles qui en dépendent ; les autres peuvent être réutilisées.</text><text x="90" y="545" fill="#bfeaff" font-size="17">Une couche = une partie de l’image</text></g></svg>