<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#10243b"/><stop offset="1" stop-color="#071321"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#20baff"/><stop offset="1" stop-color="#0876db"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#8bdcff" stroke-width="1.5"/></marker></defs><rect width="1200" height="650" rx="28" fill="url(#bg)"/><text x="48" y="68" fill="#fff" font-size="38" font-weight="700" font-family="Arial">Le démon Docker : qui fait le travail ?</text><text x="50" y="105" fill="#a9c9e7" font-size="20" font-family="Arial">Le client transmet la demande ; le démon exécute l’action.</text><g font-family="Arial" text-anchor="middle"><rect x="45" y="190" width="235" height="220" rx="22" fill="#122e4b" stroke="#338bce" stroke-width="3"/><text x="162" y="245" fill="#fff" font-size="27" font-weight="bold">1. Terminal</text><text x="162" y="290" fill="#8cff9a" font-size="22">docker run nginx</text><text x="162" y="340" fill="#d8eafa" font-size="18">Tu écris la commande</text><text x="162" y="368" fill="#d8eafa" font-size="18">et demandes une action.</text><rect x="360" y="190" width="235" height="220" rx="22" fill="#122e4b" stroke="#338bce" stroke-width="3"/><text x="477" y="245" fill="#fff" font-size="27" font-weight="bold">2. Client Docker</text><text x="477" y="295" fill="#72d8ff" font-size="24">docker</text><text x="477" y="340" fill="#d8eafa" font-size="18">Il transmet ta demande</text><text x="477" y="368" fill="#d8eafa" font-size="18">au démon.</text><rect x="675" y="160" width="245" height="280" rx="22" fill="#0b3c60" stroke="#20baff" stroke-width="4"/><text x="797" y="220" fill="#fff" font-size="28" font-weight="bold">3. Démon Docker</text><text x="797" y="270" fill="#7ee6ff" font-size="24">dockerd</text><text x="797" y="325" fill="#e4f5ff" font-size="18">Il construit, télécharge</text><text x="797" y="353" fill="#e4f5ff" font-size="18">ou lance les conteneurs.</text><path d="M280 300H350M595 300H665" stroke="#8bdcff" stroke-width="5" marker-end="url(#a)"/><path d="M920 300H970" stroke="#8bdcff" stroke-width="5" marker-end="url(#a)"/><rect x="970" y="175" width="185" height="250" rx="20" fill="#122e4b" stroke="#338bce" stroke-width="3"/><text x="1062" y="225" fill="#fff" font-size="24" font-weight="bold">Résultat</text><text x="1062" y="280" fill="#7ee6ff" font-size="20">Image créée</text><text x="1062" y="320" fill="#7ee6ff" font-size="20">Image téléchargée</text><text x="1062" y="360" fill="#7ee6ff" font-size="20">Conteneur lancé</text></g><rect x="45" y="490" width="1110" height="105" rx="20" fill="#073a32" stroke="#39d98a" stroke-width="3"/><text x="80" y="535" fill="#8cffb6" font-size="27" font-weight="bold" font-family="Arial">À retenir</text><text x="80" y="570" fill="#fff" font-size="23" font-family="Arial">Le client demande. Le démon fait le travail. Si dockerd est arrêté, les commandes ne peuvent pas aboutir.</text></svg>